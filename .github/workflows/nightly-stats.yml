# 06:00 UTC, about midnight in US Central.
# Appends stats-history.csv and writes site-drop stats files.
# Does not post to X. No X credentials.

name: Nightly stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: nightly-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record nightly counts
        env:
          RECORD_URL: https://extropyengine.com/record.json
          SUPPORTERS_URL: https://extropyengine.com/supporters.json
          POCKETS_URL: https://extropyengine.com/pockets.json
        run: node scripts/feeds/nightly-stats.mjs
      - name: Commit the ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-history.csv site-drop/public/stats.json site-drop/public/stats/index.html
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: append nightly stats"
          git push
