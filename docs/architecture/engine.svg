    <text x="262" y="510" text-anchor="middle" fill="#d8ccb8" font-size="12">3–10 later · nullifier looker · 1/10 blind</text>
    <text x="262" y="530" text-anchor="middle" fill="#888888" font-size="11">no validator class · no Consensus Engine · a neighbor is evidence, not a gavel</text>

