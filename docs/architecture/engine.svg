    <text x="675" y="492" text-anchor="middle" fill="#7fffb0" font-size="15" font-weight="600">loop.closed mints</text>
    <text x="675" y="516" text-anchor="middle" fill="#d8ccb8" font-size="12">if-then after both signatures</text>
    <text x="675" y="536" text-anchor="middle" fill="#888888" font-size="11">late burn has no expiry</text>

    <rect x="858" y="460" width="310" height="100" rx="10" fill="#140c08" stroke="#888888"/>
    <text x="1013" y="492" text-anchor="middle" fill="#f3ece1" font-size="15" font-weight="600">fail closed → XP = 0</text>
    <text x="1013" y="516" text-anchor="middle" fill="#d8ccb8" font-size="12">no quorum · reject · missing sig</text>
    <text x="1013" y="536" text-anchor="middle" fill="#888888" font-size="11">slam window: instant close = 0</text>
  </g>

  <rect x="32" y="580" width="1136" height="78" rx="10" fill="#140c08" stroke="#7fffb0"/>
  <text x="600" y="608" text-anchor="middle" fill="#7fffb0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">XP = R × F × ΔS × (w · E) × log(1/Tₛ)</text>
  <text x="600" y="632" text-anchor="middle" fill="#d8ccb8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">R = rarity of the ACTION CLASS — not reputation. F = frequency-of-decay. ΔS = bits-equivalent PROXY, proposed not typed. w·E = eight-domain weights. Tₛ = slam. Reputation never enters this product. CT never enters this product.</text>
  <text x="600" y="648" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">code: packages/xp-formula · LETTERS beat glossary drift</text>

  <text x="40" y="686" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">METERS — CT FEEDS L. L FEEDS THE TILL. IT BURNS IN THE TALLY.</text>
