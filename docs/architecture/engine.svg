    <text x="374" y="776" text-anchor="middle" fill="#888888" font-size="10">training remainder 0</text>

    <rect x="496" y="696" width="250" height="96" rx="8" fill="#140c08" stroke="#a78bfa" stroke-width="2"/>
    <text x="621" y="724" text-anchor="middle" fill="#f3ece1" font-weight="600">L this ticket</text>
    <text x="621" y="748" text-anchor="middle" fill="#d8ccb8" font-size="12">clip(H_cap · S · κ · CT_W · β)</text>
    <text x="621" y="770" text-anchor="middle" fill="#888888" font-size="10">not a sixth bag</text>

    <rect x="758" y="696" width="200" height="96" rx="8" fill="#140c08" stroke="#ff5a1f" stroke-width="2"/>
    <text x="858" y="722" text-anchor="middle" fill="#ff5a1f" font-weight="600">EP spark</text>
    <text x="858" y="744" text-anchor="middle" fill="#d8ccb8" font-size="11">XP·L + λ·L</text>
    <text x="858" y="762" text-anchor="middle" fill="#888888" font-size="10">λ default 0.15</text>
    <text x="858" y="778" text-anchor="middle" fill="#888888" font-size="10">dies in the sale</text>

    <rect x="970" y="696" width="198" height="96" rx="8" fill="#140c08" stroke="#a78bfa"/>
    <text x="1069" y="722" text-anchor="middle" fill="#f3ece1" font-weight="600">IT · CAT</text>
    <text x="1069" y="742" text-anchor="middle" fill="#d8ccb8" font-size="11">IT burns in the tally</text>
    <text x="1069" y="760" text-anchor="middle" fill="#888888" font-size="10">not XP·G · not a pile</text>
    <text x="1069" y="776" text-anchor="middle" fill="#888888" font-size="10">CAT feeds β, off mint</text>
  </g>
  <text x="600" y="814" text-anchor="middle" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">CT_W → L ← H_cap · S · κ · β(CAT)     L → EP     CT_W → IT     CAT never multiplies XP</text>

