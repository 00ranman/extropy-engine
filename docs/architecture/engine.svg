  <text x="600" y="1208" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GrantFlow as a face · Consensus Engine · Token Economy bag · validator class · Google Auth · civic sidecar · EP/IT piles · DT bag · contributor hub · [index.ts] boxes</text>
  <text x="600" y="1228" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">R as reputation · CT inside the XP product · CAT multiplying mint · leak reopening the loop · settle window · 40-day H · 5%/month IT</text>

  <text x="600" y="1268" text-anchor="middle" fill="#555555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Source: github.com/00ranman/extropy-engine  DIAGRAM.md · diagram.mmd · llms.txt</text>
  <text x="600" y="1288" text-anchor="middle" fill="#555555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Authority: extropyengine.com/key  >  xp-formula  >  DEFAULTS  >  SPEC 3.5  >  this picture</text>
  <text x="600" y="1320" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The running product is post → do → confirm. This picture is the map. A folder is not a face.</text>
