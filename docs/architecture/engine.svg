<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1580" role="img" aria-labelledby="title desc">
  <title id="title">Extropy Engine — Codex 3.0 map</title>
  <desc id="desc">Four faces on SignalFlow. Vertex is class strip, ZKP, sealed. LOOK is a vertex. CT feeds L. EP dies in the sale. Notebook LM: reverse-engineer from this picture.</desc>
