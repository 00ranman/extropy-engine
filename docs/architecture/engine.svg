<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Extropy Engine — faces, SignalFlow, meters</title>
  <desc id="desc">Four faces sit on SignalFlow. LOOK is volunteer slices, not a priesthood. Close mints XP. CT feeds L. EP dies in the sale.</desc>
  <rect width="1200" height="860" fill="#060606"/>
  <text x="600" y="36" text-anchor="middle" fill="#ff5a1f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="3">EXTROPY ENGINE</text>
  <text x="600" y="58" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">did:key on the box · post, do, confirm · one router</text>

  <text x="40" y="92" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">FACES — SAME LOOP, DIFFERENT SEATS</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="104" width="270" height="86" rx="10" fill="#140c08" stroke="#ff5a1f" stroke-width="1.5"/>
    <text x="175" y="138" text-anchor="middle" fill="#f3ece1" font-size="16" font-weight="600">LocalFlow</text>
    <text x="175" y="162" text-anchor="middle" fill="#d8ccb8" font-size="12">person · errands · rides</text>

    <rect x="330" y="104" width="270" height="86" rx="10" fill="#140c08" stroke="#ff5a1f" stroke-width="1.5"/>
    <text x="465" y="138" text-anchor="middle" fill="#f3ece1" font-size="16" font-weight="600">HomeFlow</text>
    <text x="465" y="162" text-anchor="middle" fill="#d8ccb8" font-size="12">house · neighborhood board</text>

    <rect x="620" y="104" width="250" height="86" rx="10" fill="#140c08" stroke="#ff5a1f" stroke-width="1.5"/>
    <text x="745" y="138" text-anchor="middle" fill="#f3ece1" font-size="16" font-weight="600">Quest market</text>
    <text x="745" y="162" text-anchor="middle" fill="#d8ccb8" font-size="12">2–5 minute grain</text>

    <rect x="890" y="104" width="270" height="86" rx="10" fill="#140c08" stroke="#ff5a1f" stroke-width="1.5"/>
    <text x="1025" y="138" text-anchor="middle" fill="#f3ece1" font-size="16" font-weight="600">Merchant till</text>
    <text x="1025" y="162" text-anchor="middle" fill="#d8ccb8" font-size="12">strip mall · EP dies here</text>
  </g>

  <path d="M175 190 L175 228 M465 190 L465 228 M745 190 L745 228 M1025 190 L1025 228" stroke="#ff5a1f" stroke-width="2" fill="none"/>

  <rect x="40" y="228" width="1120" height="78" rx="12" fill="#ff5a1f"/>
  <text x="600" y="258" text-anchor="middle" fill="#060606" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">SignalFlow</text>
  <text x="600" y="284" text-anchor="middle" fill="#060606" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">only router · assistant + Personal Signed Local Log (PSLL, file on your disk) + proposed ΔS · you do not score yourself</text>

  <path d="M600 306 L600 338" stroke="#22d3ee" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="80" y="338" width="500" height="86" rx="10" fill="#140c08" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="330" y="368" text-anchor="middle" fill="#f3ece1" font-size="16" font-weight="600">LOOK · both edges · volunteer slices</text>
    <text x="330" y="392" text-anchor="middle" fill="#d8ccb8" font-size="12">3–10 later looks · no validator class · no priesthood</text>
    <text x="330" y="412" text-anchor="middle" fill="#888888" font-size="11">a neighbor is evidence, not a gavel · looking writes a vertex</text>

    <rect x="620" y="338" width="500" height="86" rx="10" fill="#140c08" stroke="#7fffb0" stroke-width="1.5"/>
    <text x="870" y="368" text-anchor="middle" fill="#7fffb0" font-size="16" font-weight="600">loop.closed mints</text>
    <text x="870" y="392" text-anchor="middle" fill="#d8ccb8" font-size="12">fail closed → XP = 0 · slam window · instant = 0</text>
    <text x="870" y="412" text-anchor="middle" fill="#888888" font-size="11">no Consensus Engine package. Close is a state.</text>
  </g>
  <path d="M580 381 L620 381" stroke="#22d3ee" stroke-width="2"/>
  <path d="M870 424 L870 458" stroke="#7fffb0" stroke-width="2"/>

  <rect x="80" y="458" width="1040" height="64" rx="10" fill="#140c08" stroke="#7fffb0" stroke-width="1.5"/>
  <text x="600" y="486" text-anchor="middle" fill="#7fffb0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">XP = R × F × ΔS × (w · E) × log(1/Tₛ)</text>
  <text x="600" y="508" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">R is rarity of the action class — not reputation. Reputation never enters this product. CT never enters this product.</text>

  <path d="M600 522 L600 552" stroke="#a78bfa" stroke-width="2"/>

  <text x="40" y="548" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">METERS — CT FEEDS L. L FEEDS THE TILL. NOT BAGS.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <rect x="40" y="560" width="175" height="78" rx="8" fill="#140c08" stroke="#a78bfa"/>
    <text x="127" y="588" text-anchor="middle" fill="#f3ece1" font-weight="600">CT_W</text>
    <text x="127" y="608" text-anchor="middle" fill="#d8ccb8" font-size="11">community standing</text>
    <text x="127" y="624" text-anchor="middle" fill="#888888" font-size="10">same at compatible tills</text>

    <rect x="245" y="560" width="175" height="78" rx="8" fill="#140c08" stroke="#a78bfa"/>
    <text x="332" y="588" text-anchor="middle" fill="#f3ece1" font-weight="600">H_cap · S · β</text>
    <text x="332" y="608" text-anchor="middle" fill="#d8ccb8" font-size="11">till · you · CAT</text>
    <text x="332" y="624" text-anchor="middle" fill="#888888" font-size="10">door owns H, not CT</text>

    <rect x="450" y="560" width="250" height="78" rx="8" fill="#140c08" stroke="#a78bfa" stroke-width="2"/>
    <text x="575" y="588" text-anchor="middle" fill="#f3ece1" font-weight="600">L this ticket</text>
    <text x="575" y="612" text-anchor="middle" fill="#d8ccb8" font-size="11">clip(H_cap · S · κ · CT_W · β)</text>

    <rect x="730" y="560" width="210" height="78" rx="8" fill="#140c08" stroke="#ff5a1f" stroke-width="2"/>
    <text x="835" y="588" text-anchor="middle" fill="#ff5a1f" font-weight="600">EP spark</text>
    <text x="835" y="612" text-anchor="middle" fill="#d8ccb8" font-size="11">XP·L + λ·L · clip to list</text>

    <rect x="970" y="560" width="190" height="78" rx="8" fill="#140c08" stroke="#a78bfa"/>
    <text x="1065" y="588" text-anchor="middle" fill="#f3ece1" font-weight="600">IT · CAT</text>
    <text x="1065" y="608" text-anchor="middle" fill="#d8ccb8" font-size="11">proposal burns · β</text>
    <text x="1065" y="624" text-anchor="middle" fill="#888888" font-size="10">IT also takes CT_W</text>
  </g>

  <path d="M215 599 L245 599" stroke="#a78bfa" stroke-width="2"/>
  <path d="M420 599 L450 599" stroke="#a78bfa" stroke-width="2"/>
  <path d="M700 599 L730 599" stroke="#ff5a1f" stroke-width="2"/>
  <text x="228" y="592" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">→</text>
  <text x="433" y="592" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">→</text>
  <text x="712" y="592" fill="#ff5a1f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">→</text>

  <path d="M835 638 L835 678 L1025 678 L1025 190" stroke="#ff5a1f" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="920" y="670" fill="#ff5a1f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">EP dies at the till — not a wallet</text>

  <text x="600" y="720" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Neighborhood board is HomeFlow’s MESO skin. Not a civic sidecar. Not pink. Not a second government.</text>
  <text x="600" y="742" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Leak 0.99ⁿ on idle XP and CT (10-day ticks). Late burn has no expiry. There is no Token Economy bag.</text>
  <text x="600" y="778" text-anchor="middle" fill="#555555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">A folder is not a face. Draw this. Do not inventory packages/. Do not invent a Consensus Engine.</text>
  <text x="600" y="808" text-anchor="middle" fill="#555555" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Source: extropyengine.com/docs/engine.svg · DIAGRAM.md · LETTERS beat any generated chart</text>
</svg>
