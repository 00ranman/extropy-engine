  <text x="40" y="1100" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">RECORD / METER / SPARK — STOP SAYING TOKEN</text>
  <text x="600" y="1124" text-anchor="middle" fill="#d8ccb8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Record = unique signed vertex (CAT, closed loop). Meter = XP, CT, L. Spark = EP at the till, IT in the tally. DT is not a bag. Five objects, not six.</text>
  <text x="600" y="1146" text-anchor="middle" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Domain = eight entropy instruments (enum). Lane = skill. CAT lives on a lane. Official skins: cash + remainder, not XP on a forehead.</text>

