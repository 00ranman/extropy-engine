  <path d="M171 170 L171 198 M457 170 L457 198 M733 170 L733 198 M1019 170 L1019 198" stroke="#ff5a1f" stroke-width="2"/>

  <rect x="32" y="198" width="1136" height="72" rx="12" fill="#ff5a1f"/>
  <text x="600" y="226" text-anchor="middle" fill="#060606" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">SignalFlow — the only router</text>
  <text x="600" y="250" text-anchor="middle" fill="#060606" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">assistant you trust + Personal Signed Local Log (file on YOUR disk) + public class-strip priors · proposes ΔS · you do not type the mint · you do not score yourself</text>

  <text x="40" y="296" fill="#888888" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">DAG VERTEX — THREE ENVELOPES</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="32" y="306" width="370" height="118" rx="10" fill="#140c08" stroke="#22d3ee"/>
    <text x="217" y="332" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="600">A · public class strip</text>
    <text x="217" y="354" text-anchor="middle" fill="#f3ece1" font-size="11">class · mapper · ΔS · U · buckets</text>
    <text x="217" y="372" text-anchor="middle" fill="#f3ece1" font-size="11">evidence_root · state · opaque parents</text>
    <text x="217" y="394" text-anchor="middle" fill="#888888" font-size="11">SignalFlow scours A · no LOOK</text>
    <text x="217" y="410" text-anchor="middle" fill="#888888" font-size="10">DID/GPS/clock/photo in A = lose</text>

    <rect x="415" y="306" width="370" height="118" rx="10" fill="#140c08" stroke="#a78bfa"/>
    <text x="600" y="332" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">B · ZKP envelope</text>
    <text x="600" y="354" text-anchor="middle" fill="#f3ece1" font-size="11">circuit, not a model · DID off the row</text>
    <text x="600" y="372" text-anchor="middle" fill="#f3ece1" font-size="11">unique in this DFAO · signer bound</text>
    <text x="600" y="394" text-anchor="middle" fill="#888888" font-size="11">confirmed · band if asked · not slashed</text>
    <text x="600" y="410" text-anchor="middle" fill="#888888" font-size="10">yes/no at the till · AI does not evaluate</text>

    <rect x="798" y="306" width="370" height="118" rx="10" fill="#140c08" stroke="#ff5a1f"/>
    <text x="983" y="332" text-anchor="middle" fill="#ff5a1f" font-size="14" font-weight="600">C · sealed bytes</text>
    <text x="983" y="354" text-anchor="middle" fill="#f3ece1" font-size="11">hash to evidence_root</text>
    <text x="983" y="372" text-anchor="middle" fill="#f3ece1" font-size="11">photos, diary, GPS stay here</text>
    <text x="983" y="394" text-anchor="middle" fill="#888888" font-size="11">LOOK required · no silent fetch</text>
    <text x="983" y="410" text-anchor="middle" fill="#888888" font-size="10">like-cases live on A, not C</text>
